<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三十六年 - 润华集团 (v2)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.container{text-align:center;max-width:480px;padding:20px}
.cover{width:300px;height:300px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5);margin:0 auto 24px}
.cover img{width:100%;height:100%;object-fit:cover;border-radius:12px}
h1{font-size:28px;margin-bottom:6px;background:linear-gradient(90deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:14px;color:#aaa;margin-bottom:4px}
.artist{font-size:13px;color:#888;margin-bottom:30px}
audio{width:100%;margin-bottom:24px;outline:none}
.lyrics{background:rgba(255,255,255,0.05);border-radius:12px;padding:20px;min-height:200px;max-height:400px;overflow-y:auto;text-align:left}
.lyric-line{padding:6px 0;font-size:14px;color:#888;transition:all 0.3s}
.lyric-line.active{color:#ffd700;font-size:16px;font-weight:bold}
.credit{font-size:11px;color:#555;margin-top:30px}
</style>
</head>
<body>
<div class="container">
  <div class="cover"><img src="cover.jpg" alt="cover"></div>
  <h1>三十六年</h1>
  <div class="subtitle">润华集团 v2</div>
  <div class="artist">传澈｜风吟</div>
  <audio id="audio" controls><source src="song.mp3" type="audio/mpeg">您的浏览器不支持音频。</audio>
  <div class="lyrics" id="lyrics"></div>
  <div class="credit">词曲：传澈｜制作：传澈｜v2 史诗版</div>
</div>
<script>
const audio = document.getElementById('audio');
const lyricsDiv = document.getElementById('lyrics');
fetch('lyrics.txt').then(r=>r.text()).then(t=>{
  t.split('\n').filter(l=>l.trim()).forEach(l=>{
    const div=document.createElement('div');
    div.className='lyric-line';
    l=l.replace(/^\[.*?\]\s*/,'').replace(/^（.*?）/,'').trim();
    if(l) div.textContent=l;
    if(div.textContent) lyricsDiv.appendChild(div);
  });
});
</script>
</body>
</html>
