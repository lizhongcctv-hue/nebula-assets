<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洪流滚滚 · 传澈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #1a0303 0%, #3a0a0a 50%, #1a0505 100%);
    color: #f5e6c8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .player {
    background: rgba(30, 5, 5, 0.85);
    border: 1px solid #8a5a2a;
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.6), inset 0 0 60px rgba(138,90,42,0.15);
    width: 100%;
    max-width: 460px;
    overflow: hidden;
  }
  .cover-wrap {
    position: relative;
    width: 100%;
    height: 280px;
    background: #000;
    overflow: hidden;
  }
  .cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .cover-title {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 28px 20px 16px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    text-align: center;
  }
  .cover-title h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #f2d59a;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  .cover-title p {
    margin-top: 6px;
    font-size: 14px;
    color: #c9a36a;
    letter-spacing: 2px;
  }
  .audio-box {
    padding: 16px 20px 8px;
  }
  audio { width: 100%; height: 40px; }
  .lrc {
    max-height: 260px;
    overflow-y: auto;
    padding: 12px 20px 20px;
    scroll-behavior: smooth;
    text-align: center;
  }
  .lrc::-webkit-scrollbar { width: 4px; }
  .lrc::-webkit-scrollbar-thumb { background: #8a5a2a; border-radius: 2px; }
  .lrc-line {
    padding: 7px 0;
    font-size: 16px;
    line-height: 1.5;
    color: #9c8a6a;
    transition: all 0.35s ease;
    letter-spacing: 1px;
  }
  .lrc-line.active {
    color: #ffd97a;
    font-size: 19px;
    font-weight: 600;
    text-shadow: 0 0 14px rgba(255,180,60,0.5);
  }
  .credit {
    border-top: 1px solid rgba(138,90,42,0.4);
    padding: 12px 20px;
    text-align: center;
    font-size: 12px;
    color: #a88050;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="player">
    <div class="cover-wrap">
      <img src="cover.jpg" alt="洪流滚滚">
      <div class="cover-title">
        <h1>洪流滚滚</h1>
        <p>民族史诗 · 男声领唱 · 传澈</p>
      </div>
    </div>
    <div class="audio-box">
      <audio id="audio" controls preload="auto" src="song.mp3"></audio>
    </div>
    <div class="lrc" id="lrc"></div>
    <div class="credit">AI 创作 · 民族史诗风格 · 152秒</div>
  </div>

<script>
  const lyrics = [
    {t:0.5, l:"洪流滚滚，"},
    {t:4.2, l:"涤荡尽，"},
    {t:7.9, l:"百年耻辱雪恨。"},
    {t:11.6, l:"红船扬波初启迪，"},
    {t:15.3, l:"而今翻天覆地。"},
    {t:19.0, l:"秋收起义，"},
    {t:22.7, l:"南昌举枪，"},
    {t:26.4, l:"会师井冈山。"},
    {t:30.1, l:"长征路险，"},
    {t:33.8, l:"英雄血洒疆场。"},
    {t:41.2, l:"延安灯火日夜，"},
    {t:44.9, l:"挥毫绘就，"},
    {t:48.6, l:"民族复兴图。"},
    {t:52.3, l:"江山一统红旗展，"},
    {t:56.0, l:"紧踏时代节拍。"},
    {t:59.7, l:"破茧化蝶，"},
    {t:63.4, l:"初心不变，"},
    {t:67.1, l:"挥剑向长天。"},
    {t:70.8, l:"屹立昆仑，"},
    {t:74.5, l:"曙光在眼前！"},
    {t:81.9, l:"洪流滚滚，"},
    {t:85.6, l:"涤荡尽，"},
    {t:89.3, l:"百年耻辱雪恨。"},
    {t:93.0, l:"红船扬波初启迪，"},
    {t:96.7, l:"而今翻天覆地。"},
    {t:100.4, l:"秋收起义，"},
    {t:104.1, l:"南昌举枪，"},
    {t:107.8, l:"会师井冈山。"},
    {t:111.5, l:"长征路险，"},
    {t:115.2, l:"英雄血洒疆场。"},
    {t:122.6, l:"延安灯火日夜，"},
    {t:126.3, l:"挥毫绘就，"},
    {t:130.0, l:"民族复兴图。"},
    {t:133.7, l:"江山一统红旗展，"},
    {t:137.4, l:"紧踏时代节拍。"},
    {t:141.1, l:"破茧化蝶，"},
    {t:144.8, l:"初心不变，"},
    {t:148.5, l:"挥剑向长天。"},
    {t:152.2, l:"屹立昆仑，"},
    {t:154.0, l:"曙光在眼前！"}
  ];

  const lrcEl = document.getElementById('lrc');
  const audio = document.getElementById('audio');
  lyrics.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'lrc-line';
    div.textContent = item.l;
    div.id = 'line-' + i;
    lrcEl.appendChild(div);
  });

  let current = -1;
  audio.addEventListener('timeupdate', () => {
    const t = audio.currentTime;
    let idx = -1;
    for (let i = 0; i < lyrics.length; i++) {
      if (t >= lyrics[i].t) idx = i; else break;
    }
    if (idx !== current && idx >= 0) {
      if (current >= 0) {
        const prev = document.getElementById('line-' + current);
        if (prev) prev.classList.remove('active');
      }
      const cur = document.getElementById('line-' + idx);
      cur.classList.add('active');
      cur.scrollIntoView({ block: 'center' });
      current = idx;
    }
  });
</script>
</body>
</html>
