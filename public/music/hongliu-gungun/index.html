  ];

  const lrcEl = document.getElementById('lrc');
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('play');
  const fill = document.getElementById('fill');
  const bar = document.getElementById('bar');
  const curEl = document.getElementById('cur');
  const durEl = document.getElementById('dur');

  lyrics.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'lrc-line';
    div.textContent = item.l;
    div.id = 'line-' + i;
    lrcEl.appendChild(div);
  });

  function fmt(s){ if(!s||isNaN(s)) return '0:00'; const m=Math.floor(s/60); const ss=Math.floor(s%60); return m+':'+String(ss).padStart(2,'0'); }

  let current = -1;
  audio.addEventListener('timeupdate', () => {
    const t = audio.currentTime;
    let idx = -1;
    for (let i = 0; i < lyrics.length; i++) { if (t >= lyrics[i].t) idx = i; else break; }
    if (idx !== current && idx >= 0) {
      if (current >= 0) { const p=document.getElementById('line-'+current); if(p) p.classList.remove('active'); }
      const c = document.getElementById('line-'+idx);
      c.classList.add('active');
      c.scrollIntoView({ block: 'center' });
      current = idx;
    }
    fill.style.width = (audio.duration? (t/audio.duration*100):0) + '%';
    curEl.textContent = fmt(t);
  });
  audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(audio.duration); });
  audio.addEventListener('play', () => playBtn.classList.add('playing'));
  audio.addEventListener('pause', () => playBtn.classList.remove('playing'));

  function toggle(){ if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); }
  playBtn.addEventListener('click', toggle);
  audio.addEventListener('click', toggle);

  bar.addEventListener('click', (e) => {
    const r = bar.getBoundingClientRect();
    const p = (e.clientX - r.left) / r.width;
    if (audio.duration) audio.currentTime = p * audio.duration;
  });
